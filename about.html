<section id="faq" style="padding: 112px 64px; border-top: 1px solid var(--t2A2C2F, #2A2C2F); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 72px">
<div style="display: flex; flex-direction: column; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: var(--tv-acc-text, {{accent}})">_ FAQ</span><h2 style="font-size: 56px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600">About Three Vistas.</h2><p style="font-size: 17px; line-height: 1.6; color: var(--tA2A7AD, #A2A7AD)">Quick answers about who we are, where we work and who we work with.</p></div>
<div style="display: flex; flex-direction: column; border-top: 1px solid var(--t2A2C2F, #2A2C2F)"><details class="tv-faq" open style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Where is Three Vistas located?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Three Vistas is headquartered at 1014 Canton St., Roswell, GA 30075, in historic downtown Roswell, Georgia. We also have an office in Buckhead at 3235 Cains Hill Pl NW, Suite B, Atlanta, GA 30305.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Does Three Vistas only work with businesses in Atlanta?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">No. While we are based in the Atlanta metro area, we serve businesses across the United States, as well as clients in Canada. Most work happens remotely, with in-person sessions available in Roswell and Buckhead.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What industries does Three Vistas serve?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Our primary focus is manufacturing. We also work with legal and professional services firms, healthcare and medical groups, home and commercial service companies, multi-location brands and consumer brands.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Does Three Vistas work with manufacturers?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Yes. Our manufacturing clients include Sunbelt Modular, Spanable Buildings, CATACARB, Eminence Grey and Eminence Defense. We work with them on websites, product catalogs, dealer locators, lead generation and AI-powered marketing, and our website for Sunbelt Modular took first place for Website in the Marketing category of the Modular Building Institute’s 2026 Awards of Distinction.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What does Three Vistas do?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">We help organizations put AI to work across marketing, sales and the web: AI strategy, AI integration and automation, AI-powered marketing, AI search visibility and enterprise web design and development.</p>
</details></div>
