const a = this.props.accent ?? '#D5F01F';
const animate = this.props.animate ?? true;
const k = h / 478;
const f = (n) => Math.round(n * k * 100) / 100;
const d = f(50);
const g = Math.round(d * 6 * 100) / 100;
const go = Math.round(((d - g) / 2) * 100) / 100;
const hex = a.replace('#', '');
const r = parseInt(hex.substring(0, 2), 16) || 213;
const gg = parseInt(hex.substring(2, 4), 16) || 240;
const b = parseInt(hex.substring(4, 6), 16) || 31;
const rgba = (al) => 'rgba(' + r + ',' + gg + ',' + b + ',' + al + ')';
return {
accent: a,
w: f(857),
h,
d,
g,
go,
path: 'M ' + f(-150) + ' ' + f(320) + ' Q ' + f(60) + ' ' + f(-150) + ' ' + f(345.5) + ' ' + f(80.5),
glow1: rgba(0.6),
glow2: rgba(0.22),
glow3: rgba(0),
arcAnim: animate ? 'tvSunArc 2.4s cubic-bezier(.35,.05,.2,1) .4s both' : 'none',
colorAnim: animate ? 'tvSunColor 2.4s ease-in .4s both' : 'none',
glowOutAnim: animate ? 'tvGlowOut 2.4s ease .4s both' : 'none',
glowInAnim: animate ? 'tvGlowIn 2.6s ease-out .4s both, tvBreathe 4s ease-in-out 3.2s infinite' : 'none'
};
}
}

return Component;
});
DC.mount("enterprise-web", document.getElementById('dc-root'), {});
</script>
