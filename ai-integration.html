<section style="padding: 96px 64px 0; border-top: 1px solid var(--t2A2C2F, #2A2C2F); display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 72px">
<div style="display: flex; flex-direction: column; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: var(--tv-acc-text, {{accent}})">_ FAQ</span><h2 style="font-size: 56px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; ">AI integration, answered.</h2><p style="font-size: 17px; line-height: 1.6; color: var(--tA2A7AD, #A2A7AD)">Every engagement is custom. Not sure where to start? <a href="ai-strategy.html" style="color: var(--tv-acc-text, {{accent}}); font-weight: 600">Take the free AI readiness check →</a></p></div>
<div style="display: flex; flex-direction: column; border-top: 1px solid var(--t2A2C2F, #2A2C2F)"><details class="tv-faq" open style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What is AI integration?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">AI integration means connecting AI to the systems your business already uses — your ERP, CRM, inboxes, documents and website — so it can take on real work inside your existing workflows instead of living in a separate chat window.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What is a custom AI agent?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">A custom AI agent is software built for your business that can read information, make routine decisions and take actions across your systems, following rules you set and handing off to your team when needed.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Will this work with our older systems?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">In most cases, yes. We work with the tools you already have, including older or industry-specific software. The free workflow review will show what’s possible with your setup.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Is our data safe?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Yes. Agents only access the systems and data you approve, every action is logged and we recommend setups that keep your data private.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What if the AI makes a mistake?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">We design for it. Important actions can require human approval, agents hand off when they’re unsure and we monitor results so issues are caught and fixed quickly.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Do we need an AI strategy first?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Not necessarily. If you already know the workflow you want to improve, we can start there. If you’re not sure where to begin, our AI Strategy &amp; Readiness work is a good first step.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">How long does a pilot take?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">It depends on the workflow and the systems involved. We’ll give you a clear timeline after the free workflow review.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Who maintains it after launch?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">We do. Every Three Vistas client gets ongoing support — monitoring, tuning and updates as AI models and your systems change.</p>
