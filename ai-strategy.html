<section style="padding: 96px 64px 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 72px">
<div style="display: flex; flex-direction: column; gap: 18px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.12em; color: var(--tv-acc-text, {{accent}})">_ FAQ</span><h2 style="font-size: 56px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; ">AI strategy, answered.</h2><p style="font-size: 17px; line-height: 1.6; color: var(--tA2A7AD, #A2A7AD)">Every engagement is custom. Start with the free readiness check and we’ll tell you where you stand.</p></div>
<div style="display: flex; flex-direction: column; border-top: 1px solid var(--t2A2C2F, #2A2C2F)"><details class="tv-faq" open style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What is an AI strategy engagement?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">It’s a structured assessment of where AI can create real value in your business. We review your data, systems, people and processes, then deliver a prioritized roadmap, a business case and a 90-day plan you can act on.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Do we need clean data before we start?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">No. Most companies don’t have perfect data — and part of the strategy is identifying which data matters, what needs cleaning and which opportunities work with what you have today.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">We already use ChatGPT or Copilot. Why do we need a strategy?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Tools alone don’t create results. A strategy makes sure AI is pointed at the work that matters most, used safely and measured — instead of scattered across individual habits.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Will AI replace our employees?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">That’s not the goal. We focus on taking repetitive, low-value work off your team’s plate so people can spend time on customers, quality and growth.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Who from our team needs to be involved?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Typically a leadership sponsor plus the people closest to the work in the areas we’re assessing. We keep the time commitment light and schedule around your operations. Working sessions can happen in person at our Buckhead, Atlanta office or remotely — whichever works best for your team.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">How long does it take?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">It depends on the size of your organization and how many teams are involved. We’ll give you a clear timeline after our first conversation.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Is the readiness check really free?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Yes. The readiness check is free with no obligation. Answer six quick questions for an instant score, and we’ll follow up with a personalized walkthrough if you’d like one.</p>
</details><details class="tv-faq" style="border-bottom: 1px solid var(--t2A2C2F, #2A2C2F)">
<summary style="display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 22px 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">What happens after the strategy?<span class="tv-plus" aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--t3A3D41, #3A3D41); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1 V13 M1 7 H13" stroke="var(--tv-acc-line, {{accent}})" stroke-width="1.8"></path></svg></span></summary>
<p style="padding: 0 64px 28px 0; font-size: 17px; line-height: 1.65; color: var(--tA2A7AD, #A2A7AD)">Your roadmap is yours to keep. If you’d like help executing it, our team can build the integrations, marketing programs and AI search work it recommends.</p>
