DC.define("LogoWide", function (DCLogic) {

class Component extends DCLogic {

h,

};

DC.define("Scheduler", function (DCLogic) {

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { day: 6, slot: 1 };
}
renderVals() {
const a = this.props.accent ?? '#D5F01F';
const open = [2, 5, 6, 7, 8, 9, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23];
const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const days = [];
for (let i = 0; i < 4; i++) days.push({ label: '', disabled: true, bg: 'transparent', fg: 'transparent', weight: 400, cursor: 'default', aria: 'blank', pick: null });
for (let d = 1; d <= 24; d++) {
const avail = open.indexOf(d) >= 0;
const sel = d === this.state.day;
days.push({
label: String(d),
disabled: !avail,
bg: sel ? a : (avail ? 'var(--t26292C, #26292C)' : 'transparent'),
fg: sel ? '#0E0F10' : (avail ? 'var(--tF2F3F4, #F2F3F4)' : 'var(--t5F646A, #5F646A)'),
weight: sel || avail ? 700 : 400,
cursor: avail ? 'pointer' : 'default',
aria: 'October ' + d + (avail ? '' : ', unavailable'),
pick: () => this.setState({ day: d })
});
}
const times = ['9:30 am', '11:00 am', '1:00 pm', '2:30 pm', '3:30 pm', '4:30 pm'];
const slots = times.map((label, i) => ({
label,
bg: i === this.state.slot ? a : 'transparent',
fg: i === this.state.slot ? '#0E0F10' : 'var(--tF2F3F4, #F2F3F4)',
pick: () => this.setState({ slot: i })
}));
const wd = names[(4 + this.state.day - 1) % 7];
const dayLong = wd + ', October ' + this.state.day;
return {
accent: a,
days,
slots,
dayLong,
slotLabel: times[this.state.slot],
summary: wd.slice(0, 3) + ', Oct ' + this.state.day + ' · ' + times[this.state.slot]
};
}
}

return Component;
});
